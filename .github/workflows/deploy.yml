name: CI/CD Auto Deploy Frontend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Create Environment File
        working-directory: ./frontend
        run: |
          echo "VITE_APP_NAME=${{ secrets.VITE_APP_NAME }}" > .env
          echo "VITE_APP_TAGLINE=${{ secrets.VITE_APP_TAGLINE }}" >> .env
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env
          echo "VITE_WS_URL=${{ secrets.VITE_WS_URL }}" >> .env
          echo "VITE_DEFAULT_TARIFF=${{ secrets.VITE_DEFAULT_TARIFF }}" >> .env
          echo "VITE_DEFAULT_HISTORY_DAYS=${{ secrets.VITE_DEFAULT_HISTORY_DAYS }}" >> .env
          echo "VITE_POLL_INTERVAL_MS=${{ secrets.VITE_POLL_INTERVAL_MS }}" >> .env

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Copy dist to Server
        uses: appleboy/scp-action@master
        with:
          host: 157.15.124.192
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "frontend/dist/*"
          target: "/opt/bara-sense/"
          strip_components: 1
