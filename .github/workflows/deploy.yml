name: CI/CD Auto Deploy Frontend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Frontend to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
          VITE_APP_TAGLINE: ${{ secrets.VITE_APP_TAGLINE }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_DEFAULT_TARIFF: ${{ secrets.VITE_DEFAULT_TARIFF }}
          VITE_DEFAULT_HISTORY_DAYS: ${{ secrets.VITE_DEFAULT_HISTORY_DAYS }}
          VITE_POLL_INTERVAL_MS: ${{ secrets.VITE_POLL_INTERVAL_MS }}
        with:
          host: 157.15.124.192
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: VITE_APP_NAME,VITE_APP_TAGLINE,VITE_API_BASE_URL,VITE_WS_URL,VITE_DEFAULT_TARIFF,VITE_DEFAULT_HISTORY_DAYS,VITE_POLL_INTERVAL_MS
          script_stop: true
          script: |
            mask() {
              local v=$1
              local l=${#v}
              if [ -z "$v" ]; then echo "(kosong)"; elif [ $l -le 4 ]; then echo "***"; else echo "${v:0:3}...${v: -3}"; fi
            }
            echo "--- Frontend Environment Configuration ---"
            echo "VITE_APP_NAME: $(mask "$VITE_APP_NAME")"
            echo "VITE_APP_TAGLINE: $(mask "$VITE_APP_TAGLINE")"
            echo "VITE_API_BASE_URL: $(mask "$VITE_API_BASE_URL")"
            echo "VITE_WS_URL: $(mask "$VITE_WS_URL")"
            echo "VITE_DEFAULT_TARIFF: $(mask "$VITE_DEFAULT_TARIFF")"
            echo "VITE_DEFAULT_HISTORY_DAYS: $(mask "$VITE_DEFAULT_HISTORY_DAYS")"
            echo "VITE_POLL_INTERVAL_MS: $(mask "$VITE_POLL_INTERVAL_MS")"
            echo "------------------------------------------"

            # Cari folder repositori git frontend di server
            FRONTEND_REPO=$(find /root /opt /var/www /home -maxdepth 4 -name ".git" -type d 2>/dev/null | while read gitdir; do
              if grep -q "bara-sense-frontend" "$gitdir/config"; then
                dirname "$gitdir"
                break
              fi
            done)
            
            if [ -n "$FRONTEND_REPO" ]; then
              echo "Menemukan repositori frontend di $FRONTEND_REPO"
              echo "VITE_APP_NAME=$VITE_APP_NAME" > "$FRONTEND_REPO/.env"
              echo "VITE_APP_TAGLINE=$VITE_APP_TAGLINE" >> "$FRONTEND_REPO/.env"
              echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" >> "$FRONTEND_REPO/.env"
              echo "VITE_WS_URL=$VITE_WS_URL" >> "$FRONTEND_REPO/.env"
              echo "VITE_DEFAULT_TARIFF=$VITE_DEFAULT_TARIFF" >> "$FRONTEND_REPO/.env"
              echo "VITE_DEFAULT_HISTORY_DAYS=$VITE_DEFAULT_HISTORY_DAYS" >> "$FRONTEND_REPO/.env"
              echo "VITE_POLL_INTERVAL_MS=$VITE_POLL_INTERVAL_MS" >> "$FRONTEND_REPO/.env"
              echo "Berhasil mengupdate .env di $FRONTEND_REPO"
            else
              echo "PERINGATAN: Repositori frontend tidak ditemukan, .env gagal diperbarui!"
            fi
            
            # Tetap export ke current session
            export VITE_APP_NAME=$VITE_APP_NAME
            export VITE_APP_TAGLINE=$VITE_APP_TAGLINE
            export VITE_API_BASE_URL=$VITE_API_BASE_URL
            export VITE_WS_URL=$VITE_WS_URL
            export VITE_DEFAULT_TARIFF=$VITE_DEFAULT_TARIFF
            export VITE_DEFAULT_HISTORY_DAYS=$VITE_DEFAULT_HISTORY_DAYS
            export VITE_POLL_INTERVAL_MS=$VITE_POLL_INTERVAL_MS
            
            /usr/bin/bash /opt/deploy-frontend.sh
